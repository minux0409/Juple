apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()

    //   "dogfood" and "release" each need their own Metro config (debug is untouched - it never
    //   bundles at all, see debuggableVariants above):
    //   - metro.dogfood.config.js sets JUPLE_API_ENV='dogfood' so
    //     babel-plugin-transform-inline-environment-variables inlines it into
    //     src/api/apiConfig.ts, which then resolves to the Azure Dev Backend.
    //   - metro.release.config.js refuses to bundle at all (build-time failure) unless a real
    //     JUPLE_API_BASE_URL is provided - there is no Production Backend yet, and a release
    //     build must never silently ship without one. See both files for details.
    if (gradle.startParameter.taskNames.any { it.contains("Dogfood") }) {
        bundleConfig = file("../../metro.dogfood.config.js")
    } else if (gradle.startParameter.taskNames.any { it.contains("Release") }) {
        bundleConfig = file("../../metro.release.config.js")
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.juple.app"
    defaultConfig {
        applicationId "com.juple.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // Captures the Microsoft Entra External ID OAuth redirect (react-native-app-auth).
        // appLinksHost feeds AndroidManifest.xml's App Links intent-filter (see its comment) - no
        // real production domain exists yet, so this defaults to an RFC 2606 reserved,
        // guaranteed-unresolvable placeholder rather than a fabricated domain. Override per build
        // once a real domain exists, e.g.:
        //   JUPLE_PUBLIC_WEB_HOST=app.example.com ./gradlew assembleRelease
        // Kept as the same env var name JS-side config reads (see babel.config.js/
        // src/config/publicWebConfig.ts) even though this is read by Gradle, not Metro/Babel - the
        // two must agree on the same real domain once one exists, just injected through each
        // build tool's own mechanism.
        //
        // This placeholder default applies to every buildType, including "release" - deliberately
        // not overridden/validated here for release specifically: any check placed inside a
        // buildType { } closure runs during Gradle's DSL configuration phase for ALL buildTypes
        // every time, even an unrelated `assembleDebug`/`assembleDogfood`, which would break the
        // very builds this default exists to keep working. The real Production fail-fast (refusing
        // to ship a release with this placeholder, no host, or localhost) lives in
        // metro.release.config.js instead - it only ever runs when the "release" variant's own
        // bundle task executes, so it cannot affect any other buildType. See that file for details.
        manifestPlaceholders = [
            appAuthRedirectScheme: "com.juple.app.auth",
            appLinksHost: System.getenv("JUPLE_PUBLIC_WEB_HOST") ?: "app-links-host-not-configured.invalid"
        ]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        dogfood {
            // Real, standalone-runnable build for on-device dogfooding without a PC/Metro - not
            // in the react{} block's debuggableVariants default ("debug", "debugOptimized"), so
            // the React Native Gradle Plugin bundles JS into the APK for this buildType exactly
            // like release. Talks to the Azure Development Backend instead of Production (see
            // src/api/apiConfig.ts and this file's react{} block above). applicationId is left
            // unchanged for now (installing over the same com.juple.app as debug/release builds
            // is the deliberate choice for this round) - a suffixed id can be revisited later if
            // running both side by side ever becomes necessary.
            initWith release
            // Prebuilt AAR dependencies (react-android, hermes-android, ...) only publish
            // debug/release variants - without this, Gradle can't resolve them for a buildType
            // it doesn't recognize by name.
            matchingFallbacks = ['release']
            // The React Native Gradle Plugin only auto-fills this manifest placeholder for
            // buildTypes literally named "debug"/"release"/"debugOptimized" (see
            // AgpConfiguratorUtils.configureBuildTypesForApp) - dogfood needs it set explicitly,
            // and false is the correct value regardless: dogfood only ever talks to the Azure Dev
            // Backend over HTTPS (see src/api/apiConfig.ts), so cleartext HTTP is never needed.
            manifestPlaceholders["usesCleartextTraffic"] = "false"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Durable one-shot fallback for the incoming-share save (see IncomingShareRetryScheduler).
    implementation("androidx.work:work-runtime:2.11.2")
}
