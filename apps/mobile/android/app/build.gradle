import org.gradle.api.GradleException

apply plugin: "com.android.application"
// @react-native-firebase/app's official Android setup requires this applied right after
// com.android.application. Reads google-services.json per buildType via the plugin's own
// documented src/<buildType>/google-services.json override (see
// https://firebase.google.com/docs/android/google-services-plugin-and-file):
//   - src/debug/google-services.json   -> Dev Firebase project (juple-9fa62)
//   - src/dogfood/google-services.json -> same Dev Firebase project (Dogfood also talks to the
//     Azure Dev Backend - see this file's dogfood buildType comment - so it uses the same
//     Firebase project as debug; duplicated rather than shared via a symlink/copy task per
//     explicit instruction to avoid custom build hacks for this).
// There is deliberately no src/release/google-services.json and no app/google-services.json
// fallback at the module root: a Production Firebase project does not exist yet, and the plugin
// itself hard-fails processReleaseGoogleServices ("File google-services.json is missing...") the
// moment assembleRelease actually needs it, rather than silently reusing Dev's config - this is
// the plugin's own built-in behavior, not custom code.
apply plugin: "com.google.gms.google-services"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()

    //   "dogfood" and "release" each need their own Metro config (debug is untouched - it never
    //   bundles at all, see debuggableVariants above):
    //   - metro.dogfood.config.js sets JUPLE_API_ENV='dogfood' so
    //     babel-plugin-transform-inline-environment-variables inlines it into
    //     src/api/apiConfig.ts, which then resolves to the Azure Dev Backend.
    //   - metro.release.config.js refuses to bundle at all (build-time failure) unless a real
    //     JUPLE_API_BASE_URL is provided - there is no Production Backend yet, and a release
    //     build must never silently ship without one. See both files for details.
    if (gradle.startParameter.taskNames.any { it.contains("Dogfood") }) {
        bundleConfig = file("../../metro.dogfood.config.js")
    } else if (gradle.startParameter.taskNames.any { it.contains("Release") }) {
        bundleConfig = file("../../metro.release.config.js")
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.juple.app"
    defaultConfig {
        applicationId "com.juple.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // Captures the Microsoft Entra External ID OAuth redirect (react-native-app-auth).
        // appLinksHost feeds AndroidManifest.xml's App Links intent-filter (see its comment) - no
        // real production domain exists yet, so this defaults to an RFC 2606 reserved,
        // guaranteed-unresolvable placeholder rather than a fabricated domain. Override per build
        // once a real domain exists, e.g.:
        //   JUPLE_PUBLIC_WEB_HOST=app.example.com ./gradlew assembleRelease
        // Kept as the same env var name JS-side config reads (see babel.config.js/
        // src/config/publicWebConfig.ts) even though this is read by Gradle, not Metro/Babel - the
        // two must agree on the same real domain once one exists, just injected through each
        // build tool's own mechanism.
        //
        // This placeholder default applies to every buildType, including "release" - deliberately
        // not overridden/validated here for release specifically: any check placed inside a
        // buildType { } closure runs during Gradle's DSL configuration phase for ALL buildTypes
        // every time, even an unrelated `assembleDebug`/`assembleDogfood`, which would break the
        // very builds this default exists to keep working. The real Production fail-fast (refusing
        // to ship a release with this placeholder, no host, or localhost) lives in
        // metro.release.config.js instead - it only ever runs when the "release" variant's own
        // bundle task executes, so it cannot affect any other buildType. See that file for details.
        manifestPlaceholders = [
            appAuthRedirectScheme: "com.juple.app.auth",
            appLinksHost: System.getenv("JUPLE_PUBLIC_WEB_HOST") ?: "app-links-host-not-configured.invalid"
        ]
    }
    // Dogfood's and Release's signing identities (see below) are each read from their own
    // gitignored local properties file, falling back to environment variables of the same name -
    // see README's "Dogfood signing" / "Production release signing" sections for how to set either
    // up. Neither file nor its env vars are required for the other buildTypes, so each stays a
    // no-op everywhere else.
    def dogfoodSigningProps = new Properties()
    def dogfoodSigningPropsFile = file("dogfood-signing.local.properties")
    if (dogfoodSigningPropsFile.exists()) {
        dogfoodSigningPropsFile.withInputStream { dogfoodSigningProps.load(it) }
    }
    def dogfoodSigningValue = { String key ->
        dogfoodSigningProps.getProperty(key) ?: System.getenv(key)
    }

    def releaseSigningProps = new Properties()
    def releaseSigningPropsFile = file("release-signing.local.properties")
    if (releaseSigningPropsFile.exists()) {
        releaseSigningPropsFile.withInputStream { releaseSigningProps.load(it) }
    }
    def releaseSigningValue = { String key ->
        releaseSigningProps.getProperty(key) ?: System.getenv(key)
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        dogfood {
            // A dedicated signing identity for the "dogfood" buildType ONLY - never Production/
            // Play App Signing (see the "release" buildType below). Deliberately does NOT fall
            // back to signingConfigs.debug when unset: debug.keystore is a machine-local,
            // gitignored file (see .gitignore's *.keystore rule), and every machine typically
            // generates its own - which is exactly why a dogfood APK built on one PC used to fail
            // to install-update over one built on another (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
            // This identity is meant to be the same physical keystore file, copied safely between
            // every machine that dogfoods (see README).
            //
            // Left incomplete/null on purpose when unconfigured - AGP's own generated
            // `validateSigningDogfood` task (a dogfood-only task, see the build's task list) fails
            // the build with a clear signing-config error the moment a dogfood-variant task
            // actually needs it, without ever touching Debug/Release's own configuration. This
            // avoids a subtler trap: a `throw` written directly in this closure would run during
            // Gradle's DSL configuration phase for every buildType on every invocation - including
            // an unrelated `assembleDebug` - since AGP evaluates all buildTypes' blocks regardless
            // of which task was actually requested.
            def storeFilePath = dogfoodSigningValue("JUPLE_DOGFOOD_STORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
            }
            storePassword dogfoodSigningValue("JUPLE_DOGFOOD_STORE_PASSWORD")
            keyAlias dogfoodSigningValue("JUPLE_DOGFOOD_KEY_ALIAS")
            keyPassword dogfoodSigningValue("JUPLE_DOGFOOD_KEY_PASSWORD")
        }
        release {
            // The Google Play App Signing *upload key* - this identity signs the AAB/APK only for
            // upload to the Play Console; Play then re-signs the artifact actually delivered to
            // users with its own separately-held App Signing key. Never Debug's or Dogfood's
            // identity - see README's "Production release signing" section for the full Upload
            // key / App Signing key / assetlinks.json relationship (they are three different
            // certificates, not interchangeable).
            //
            // Left incomplete/null on purpose when unconfigured, same reasoning as
            // signingConfigs.dogfood above - confirmed by actually running the release variant
            // with no credentials set: AGP treats this signingConfig as not-yet-configured (no
            // `validateSigningRelease` task is even registered) rather than silently completing it
            // with Debug's keystore (the previous state - see this file's git history), so a
            // release-variant task that reaches signing fails instead of producing a debug-signed
            // artifact. Once JUPLE_RELEASE_STORE_FILE etc. are set to real values, the same
            // `validateSigningRelease` task appears and fails clearly on any remaining problem
            // (e.g. a wrong keystore path), still before ever touching Debug's identity.
            def storeFilePath = releaseSigningValue("JUPLE_RELEASE_STORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
            }
            storePassword releaseSigningValue("JUPLE_RELEASE_STORE_PASSWORD")
            keyAlias releaseSigningValue("JUPLE_RELEASE_KEY_ALIAS")
            keyPassword releaseSigningValue("JUPLE_RELEASE_KEY_PASSWORD")
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Google Play App Signing upload key - see signingConfigs.release above and README's
            // "Production release signing" section. Deliberately NOT signingConfigs.dogfood - that
            // identity is dogfood-only (see above) and must never be reused as/confused with the
            // Play App Signing upload key.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        dogfood {
            // Real, standalone-runnable build for on-device dogfooding without a PC/Metro - not
            // in the react{} block's debuggableVariants default ("debug", "debugOptimized"), so
            // the React Native Gradle Plugin bundles JS into the APK for this buildType exactly
            // like release. Talks to the Azure Development Backend instead of Production (see
            // src/api/apiConfig.ts and this file's react{} block above). applicationId is left
            // unchanged for now (installing over the same com.juple.app as debug/release builds
            // is the deliberate choice for this round) - a suffixed id can be revisited later if
            // running both side by side ever becomes necessary.
            initWith release
            // Prebuilt AAR dependencies (react-android, hermes-android, ...) only publish
            // debug/release variants - without this, Gradle can't resolve them for a buildType
            // it doesn't recognize by name.
            matchingFallbacks = ['release']
            // Overrides release's inherited signingConfigs.release (see initWith above) with
            // Dogfood's own dedicated identity - see signingConfigs.dogfood's comment.
            signingConfig signingConfigs.dogfood
            // The React Native Gradle Plugin only auto-fills this manifest placeholder for
            // buildTypes literally named "debug"/"release"/"debugOptimized" (see
            // AgpConfiguratorUtils.configureBuildTypesForApp) - dogfood needs it set explicitly,
            // and false is the correct value regardless: dogfood only ever talks to the Azure Dev
            // Backend over HTTPS (see src/api/apiConfig.ts), so cleartext HTTP is never needed.
            manifestPlaceholders["usesCleartextTraffic"] = "false"
        }
    }
}

// Explicit Production release signing pre-build check - see README's "Production release signing"
// section. signingConfigs.release above already leaves storeFile/password/alias/keyPassword unset
// when unconfigured (so it never silently completes with Debug's keystore), but testing that state
// directly showed AGP responds by not registering a `validateSigningRelease` task at all, rather
// than failing - not the explicit, always-present fail-fast a Production release needs. This task
// re-checks the same four Play App Signing upload-key values on its own and is wired (below) as a
// dependency of "release"'s own preReleaseBuild lifecycle task, so it always runs whenever a
// release-variant task graph is actually built (assembleRelease, bundleRelease, ...) - not
// Debug's preDebugBuild or Dogfood's preDogfoodBuild, which is a separate buildType with its own
// lifecycle task and never depends on this one.
def releaseSigningVerifyProps = new Properties()
def releaseSigningVerifyPropsFile = file("release-signing.local.properties")
if (releaseSigningVerifyPropsFile.exists()) {
    releaseSigningVerifyPropsFile.withInputStream { releaseSigningVerifyProps.load(it) }
}
def releaseSigningVerifyValue = { String key ->
    releaseSigningVerifyProps.getProperty(key) ?: System.getenv(key)
}

tasks.register("verifyReleaseSigning") {
    group = "verification"
    description = "Fails with a clear error if any Play App Signing upload-key credential is " +
        "missing, or the keystore file does not exist - see README's \"Production release " +
        "signing\" section. Runs only when a release-variant task graph is actually built " +
        "(wired to preReleaseBuild below), never for Debug/Dogfood."
    // All checking happens in doLast (task action / execution time), not here in the
    // configuration block - a Gradle sync or an unrelated assembleDebug/assembleDogfood only
    // configures tasks, it does not execute this task's action, so neither ever sees this fail.
    doLast {
        // Label only, never the actual secret value, in any error message below.
        def requiredKeys = [
            JUPLE_RELEASE_STORE_FILE    : 'store file path',
            JUPLE_RELEASE_STORE_PASSWORD: 'store password',
            JUPLE_RELEASE_KEY_ALIAS     : 'key alias',
            JUPLE_RELEASE_KEY_PASSWORD  : 'key password',
        ]
        def missing = requiredKeys.findAll { key, label -> !releaseSigningVerifyValue(key) }
            .collect { key, label -> "${key} (${label})" }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Production release signing is not configured - missing: ${missing.join(', ')}. " +
                    'Set these in android/app/release-signing.local.properties (gitignored) or as ' +
                    'environment variables before building a release - see README\'s "Production ' +
                    'release signing" section. Refusing to build; this never falls back to ' +
                    "Debug's keystore."
            )
        }
        def storeFilePath = releaseSigningVerifyValue('JUPLE_RELEASE_STORE_FILE')
        if (!file(storeFilePath).exists()) {
            throw new GradleException(
                "Production release signing keystore not found at '${storeFilePath}' " +
                    '(from JUPLE_RELEASE_STORE_FILE) - check the path in ' +
                    'android/app/release-signing.local.properties or the environment variable. ' +
                    'See README\'s "Production release signing" section.'
            )
        }
    }
}

afterEvaluate {
    // preReleaseBuild is AGP's own generated lifecycle task for the "release" variant specifically
    // - looked up here (not referenced by name earlier) because AGP creates it while evaluating
    // the android {} block above, so it does not exist yet at this file's top level until after
    // that evaluation completes.
    tasks.named('preReleaseBuild') {
        dependsOn('verifyReleaseSigning')
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Durable one-shot fallback for the incoming-share save (see IncomingShareRetryScheduler).
    implementation("androidx.work:work-runtime:2.11.2")

    // Plain JVM unit tests only (no Android framework/Robolectric) - see app/src/test.
    testImplementation("junit:junit:4.13.2")
}
