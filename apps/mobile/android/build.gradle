buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Reads app/src/<buildType>/google-services.json - required by @react-native-firebase/app
        // (see android/app/build.gradle's "com.google.gms.google-services" plugin application).
        classpath("com.google.gms:google-services:4.5.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Microsoft's Native Authentication SDK resolves a display-mask dependency from this feed.
// The SDK itself is scoped to the dogfood variant below; release/Play builds do not include it.
allprojects {
    repositories {
        maven {
            url 'https://pkgs.dev.azure.com/MicrosoftDeviceSDK/DuoSDK-Public/_packaging/Duo-SDK-Feed/maven/v1'
            name 'Duo-SDK-Feed'
        }
    }
}
