services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: juple-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set}
    ports:
      - "14333:1433"
    volumes:
      - juple_sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  azurite:
    # Blob-only mode (azurite-blob), since Item images only need Blob Storage - no Queue/Table.
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    container_name: juple-azurite
    restart: unless-stopped
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data"
    ports:
      - "10000:10000"
    volumes:
      - juple_azurite_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(10000,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  juple_sql_data:
    name: juple_sql_data
  juple_azurite_data:
    name: juple_azurite_data
